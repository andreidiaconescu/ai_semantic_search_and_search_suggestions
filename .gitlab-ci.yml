# Kept in sync with .github/workflows/ci.yml — same steps, different platform syntax.
image: python:3.10

services:
  - name: pgvector/pgvector:pg16
    alias: postgres

variables:
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres

test:
  stage: test
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - python migrations/runner.py --url "$DATABASE_URL"
    - ruff check .
    - pytest
